    browserSpeak(word, lang);
    toast('ออกเสียงสด ๆ ด้วยเบราว์เซอร์ (ไม่บันทึกไฟล์) — ใส่ API key ในหน้าตั้งค่าเพื่อบันทึกไฟล์เก็บไว้');
    return;
  }
  toast('กำลังสร้างเสียง...');
  try {
    const profId = (document.getElementById('f-voice') || {}).value || '';
    tmpAudio = await aiTTS(word, lang, profId);
    tmpAudioVoice = profId || state.settings.voice;
    const p = document.getElementById('audioPill');
    if (p) { p.textContent = 'มีไฟล์เสียงแล้ว'; p.classList.add('ok'); }
    playDataURL(tmpAudio);
    toast('สร้างไฟล์เสียงสำเร็จ');
  } catch (e) { toast('สร้างเสียงไม่สำเร็จ: ' + e.message); }
}
function previewSound() {
  if (tmpAudio) { playDataURL(tmpAudio); return; }
  const word = (document.getElementById('f-word') || {}).value || '';
  const lang = (document.getElementById('f-lang') || {}).value || 'en-US';
  if (word.trim()) browserSpeak(word, lang); else toast('ยังไม่มีคำให้อ่าน');
}

function saveCard() {
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const word = v('f-word');
  if (!word) { toast('กรุณาใส่คำศัพท์'); return; }
  const data = {
    catId: v('f-cat'), word,
    readThai: v('f-rt'), readEn: v('f-re'), mean: v('f-mean'),
    lang: v('f-lang'), img: tmpImg, audio: tmpAudio, voice: v('f-voice'),
    src: v('f-src'), book: v('f-book'), note: v('f-note'), write: v('f-write'),
    audioVoice: tmpAudio ? (tmpAudioVoice || null) : null
  };
  data.updated = new Date().toISOString();
  if (editingId) {
    const c = state.cards.find(x => x.id === editingId);
    const stepEl = document.getElementById('f-step'), dueEl = document.getElementById('f-due');
    Object.assign(c, data);
    if (stepEl) c.step = Number(stepEl.value);
    if (dueEl && dueEl.value) c.due = dueEl.value;
    toast('บันทึกการแก้ไขแล้ว');
  } else {
    const t = todayStr();
    state.cards.push(Object.assign({ id: uid('card'), step: 0, due: t, created: t, lastReview: '', reps: 0, history: [] }, data, { updated: data.updated || new Date().toISOString() }));
    toast('เพิ่มบัตรคำแล้ว · เริ่มทบทวนได้เลย');
  }
  saveState(); closeModal(); render();
}

function deleteCard(id) {
  const c = state.cards.find(x => x.id === id);
  if (!c) return;
  if (!confirm('ลบบัตร “' + c.word + '” ใช่ไหม?')) return;
  state.cards = state.cards.filter(x => x.id !== id);
  if (ui.session) ui.session.ids = ui.session.ids.filter(x => x !== id);
  saveState(); closeModal(); render(); toast('ลบบัตรแล้ว');
}

/* ---------------- Modal: หมวดหมู่ ---------------- */
function openCatModal(id, parentId) {
  // บนมือถือแถบเมนูและ overlay จะบังปุ่มในโมดัล หากไม่ปิดก่อน
  closeSidebar();
  const c = id ? catById(id) : null;
  const parentOptions = `<option value="">— เป็นหมวดหลัก —</option>` + catsIndented(true)
    .filter(x => !c || (x.cat.id !== c.id && !descendants(c.id).some(d => d.id === x.cat.id)))
    .map(({ cat, depth }) => `<option value="${cat.id}" ${(c ? c.parentId : parentId) === cat.id ? 'selected' : ''}>${'— '.repeat(depth)}${esc(cat.name)}</option>`).join('');

  document.getElementById('modalRoot').innerHTML = `
  <div class="backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:520px">
      <header><h3 style="font-size:16px">${c ? 'แก้ไขหมวดหมู่' : 'เพิ่มหมวดหมู่'}</h3>
        <div class="spacer"></div><button class="icon-btn" style="font-size:18px" onclick="closeModal()">✕</button></header>
      <div class="body">
        <div class="row2">
          <div class="field"><label>ชื่อหมวดหมู่ *</label>
            <input id="c-name" value="${esc(c ? c.name : '')}" placeholder="เช่น ร้านอาหาร" autofocus
              onkeydown="if(event.key==='Enter'){event.preventDefault();saveCat('${id || ''}')}"></div>
          <div class="field"><label>ไอคอน (อิโมจิ)</label>
            <input id="c-icon" value="${esc(c ? c.icon : '📁')}" maxlength="4"></div>
        </div>
        <div class="field"><label>อยู่ภายใต้หมวด</label>
          <select id="c-parent">${parentOptions}</select>
          <div class="hint">เว้นว่าง = หมวดหลัก (ซ้อนได้ไม่จำกัดชั้น)</div></div>
        <div class="field"><label>ภาษาหลักของหมวด</label>
          <select id="c-lang">${LANGS.map(l => `<option value="${l.v}" ${(c ? c.lang : 'en-US') === l.v ? 'selected' : ''}>${l.flag} ${l.n}</option>`).join('')}</select></div>
        <div class="field"><label>การแสดงผล</label>
          <select id="c-hidden">
            <option value="0" ${!c || !c.hidden ? 'selected' : ''}>แสดงปกติ</option>
            <option value="1" ${c && c.hidden ? 'selected' : ''}>ซ่อนหมวดนี้</option>
          </select></div>
      </div>
      <footer>
        ${c ? `<button class="btn danger" onclick="deleteCat('${c.id}')">ลบหมวดนี้</button>` : ''}
        <div class="spacer"></div>
        <button class="btn" onclick="closeModal()">ยกเลิก</button>
        <button class="btn primary" onclick="saveCat('${id || ''}')">บันทึก</button>
      </footer>
    </div>
  </div>`;
  requestAnimationFrame(() => { const el = document.getElementById('c-name'); if (el) { el.focus(); el.select(); } });
}
function saveCat(id) {
  const name = document.getElementById('c-name').value.trim();
  if (!name) { toast('ใส่ชื่อหมวดก่อน'); return; }
  const data = {
    name,
    icon: document.getElementById('c-icon').value.trim() || '📁',
    parentId: document.getElementById('c-parent').value || null,
    lang: document.getElementById('c-lang').value,
    hidden: document.getElementById('c-hidden').value === '1'
  };
  if (id) {
    const target = catById(id);
    if (!target) { toast('ไม่พบหมวดหมู่นี้ กรุณาโหลดหน้าใหม่'); return; }
    Object.assign(target, data);
  } else state.cats.push(Object.assign({ id: uid('cat') }, data));
  saveState(); closeModal(); render(); toast('บันทึกหมวดหมู่แล้ว');
}
function deleteCat(id) {
  const kids = descendants(id);
  const inCat = state.cards.filter(c => catIdsIn(id).includes(c.catId));
  const msg = `ลบหมวด “${catById(id).name}”` + (kids.length ? ` และหมวดย่อย ${kids.length} หมวด` : '') +
    (inCat.length ? `\n\nมีบัตรคำ ${inCat.length} ใบในหมวดนี้ — จะลบบัตรเหล่านั้นด้วย\n\nยืนยันหรือไม่?` : '\n\nยืนยันหรือไม่?');
  if (!confirm(msg)) return;
  const ids = catIdsIn(id);
  state.cats = state.cats.filter(c => !ids.includes(c.id));
  state.cards = state.cards.filter(c => !ids.includes(c.catId));
  saveState(); closeModal(); render(); toast('ลบหมวดแล้ว');
}

/* ---------------- นำเข้า / ส่งออก ---------------- */
function download(name, content, type) {
  const blob = new Blob([content], { type: type || 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportData() {
  download('flashcards-backup-' + todayStr() + '.json', JSON.stringify(state, null, 2));
  toast('ดาวน์โหลดไฟล์สำรองแล้ว');
}
function exportCSV() {
  const head = ['คำศัพท์', 'คำอ่านไทย', 'คำอ่านอังกฤษ', 'ความหมาย', 'หมวด', 'ขั้น', 'ช่วงวัน', 'กำหนดทบทวน', 'ทบทวนแล้ว(ครั้ง)', 'ที่มา', 'หนังสือ', 'โน้ต', 'ช่องเขียน', 'อัปเดตล่าสุด'];
  const rows = state.cards.map(c => [
    c.word, c.readThai, c.readEn, c.mean, catPath(c.catId),
    c.step || 0, c.step ? INTERVALS[c.step - 1] : 0, c.due || '', c.reps || 0, c.src || '', c.book || '', c.note || '',
    c.write || '', c.updated ? new Date(c.updated).toLocaleString('th-TH') : ''
  ]);
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  download('flashcards-' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  toast('ส่งออก CSV แล้ว (เปิดใน Google Sheets ได้เลย)');
}
function importData(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if (!j.cards || !j.cats) throw new Error('รูปแบบไม่ถูกต้อง');
      if (!confirm('นำเข้าข้อมูล ' + j.cards.length + ' ใบ จะแทนที่ข้อมูลปัจจุบันทั้งหมด?\n(ระบบจะเก็บสำเนาข้อมูลเดิมไว้ให้กู้คืน)')) return;
      try { localStorage.setItem(LS_BAK, JSON.stringify(Object.assign({}, state, { savedAt: Date.now() }))); } catch (e) {}
      state = j;
      state.settings = Object.assign(defaultState().settings, j.settings || {});
      saveState(true); render(); toast('นำเข้าข้อมูลสำเร็จ');
    } catch (e) { toast('ไฟล์ไม่ถูกต้อง: ' + e.message); }
  };
  fr.readAsText(f);
}
function resetAll() {
  if (!confirm('รีเซ็ตเป็นข้อมูลตัวอย่างทั้งหมด? ข้อมูลที่เพิ่มเองจะหายไป')) return;
  state = defaultState();
  saveState(true); render(); toast('รีเซ็ตแล้ว');
}

/* ---------------- คีย์ลัด ---------------- */
/* ---------- พฤติกรรมบนมือถือ/iPad ---------- */
document.addEventListener('click', e => {
  const sb = document.getElementById('sidebar');
  if (!sb || !sb.classList.contains('open')) return;
  if (sb.contains(e.target) || e.target.closest('.menu-btn')) return;
  closeSidebar();
});
/* ล็อกการเลื่อนพื้นหลังเมื่อเปิดโมดัล (ทุกตัว) */
(function watchModal() {
  const root = document.getElementById('modalRoot');
  if (!root) return;
  new MutationObserver(() => {
    const open = root.innerHTML.trim().length > 0;
    document.body.classList.toggle('modal-open', open);
  }).observe(root, { childList: true, subtree: false });
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modalRoot').innerHTML = '';
    closeSidebar();
    return;
  }
  if (ui.view !== 'review' || !ui.session) return;
  if (document.getElementById('modalRoot').innerHTML.trim()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.code === 'Space') { e.preventDefault(); if (!ui.revealed) revealAnswer(); else answer(2); }
  if (e.key === '1') { if (ui.revealed) answer(0); }
  if (e.key === '2') { if (ui.revealed) answer(1); }
  if (e.key === '3') { if (ui.revealed) answer(2); }
  if (e.key === '4' && state.settings.scheduler === 'anki') { if (ui.revealed) answer(3); }
  if (e.key === 's') { const c = state.cards.find(x => x.id === ui.session.ids[ui.session.i]); if (c) playCardAudio(c); }
});

/* ---------------- บูต ---------------- */
window.addEventListener('pagehide', () => { if (saveTimer) { clearTimeout(saveTimer); saveState(true); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) { clearTimeout(saveTimer); saveState(true); } });
/* เซฟซ้ำทุก 60 วินาทีถ้ามีการแก้ไขค้างอยู่ (กันข้อมูลหายจากเครื่องค้าง/ปิดกะทันหัน) */
setInterval(() => {
  if (!state) return;
  if (Date.now() - (lastSavedAt || 0) > 60 * 1000) saveState(true);
}, 60 * 1000);

(async function boot() {
  await loadState();
  if ('speechSynthesis' in window) {
    try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
  }
  render();
  if (!ui.storageOK) {
    setTimeout(() => toast('โหมดพรีวิว: ข้อมูลอาจไม่ถูกบันทึก — กดสำรองข้อมูลไว้ด้วย'), 900);
  }
})();
</script>
