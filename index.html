<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>บัตรคำ · ตารางทบทวนความจำ 1-3-7-14-30-60-90</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#141b2d; --muted:#6b7490; --line:#e5e8f2;
  --brand:#4f46e5; --brand-soft:#ecebff; --ok:#0f9d76; --ok-soft:#e6f8f1;
  --warn:#c2760a; --warn-soft:#fdf3e2; --danger:#dc2626; --danger-soft:#fdecec;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px -18px rgba(16,24,40,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[onclick]{touch-action:manipulation}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Thai","IBM Plex Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55;
}
a{color:var(--brand)}
h1,h2,h3,h4{margin:0;line-height:1.3}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- layout ---------- */
.app{display:flex;min-height:100%}
.sidebar{
  width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c6bff);
  display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 14px -6px #4f46e5}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav button{
  display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:11px;
  padding:9px 11px;color:#374151;text-align:left;font-size:14px
}
.nav button:hover{background:#f5f6fc}
.nav button.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav .badge{margin-left:auto;background:#eef0f7;color:#4b5563;font-size:11.5px;font-weight:700;
  border-radius:999px;padding:1px 8px}
.nav button.active .badge{background:#fff;color:var(--brand)}
.side-h{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9aa2b8;
  padding:10px 8px 6px;display:flex;align-items:center;justify-content:space-between}
.cat-tree{display:flex;flex-direction:column;gap:1px}
.cat-row{display:flex;align-items:center;gap:6px;border-radius:10px;padding:5px 6px;font-size:13.5px}
.cat-row:hover{background:#f6f7fc}
.cat-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cat-row.hidden-cat .name{color:#a8aec2;text-decoration:line-through}
.cat-row .cnt{font-size:11px;color:#9aa2b8;font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:0;padding:2px 4px;border-radius:7px;color:#98a0b6;line-height:1;font-size:13px}
.icon-btn:hover{background:#eceef8;color:var(--brand)}
.cat-row .children{display:none}
.main{flex:1;min-width:0;padding:20px 26px 80px;max-width:1240px;width:100%}
body.modal-open{overflow:hidden;touch-action:none}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.h1{font-size:21px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
  color:var(--ink);border-radius:11px;padding:9px 14px;font-size:14px;font-weight:600;
  box-shadow:0 1px 1px rgba(16,24,40,.03);transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{background:#fff;border-color:#f3c7c7;color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:#eef0f7;color:#4b5563;border-radius:999px;
  padding:2px 9px;font-size:11.5px;font-weight:700}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#8b93aa;
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:800;background:#fbfbfe}
table.tbl td{padding:9px 10px;border-bottom:1px solid #f1f3f9;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#fafbff}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:3px;background:#e3e6f0;display:inline-block}
.dots i.on{background:var(--ok)}
.dots i.now{background:var(--brand);box-shadow:0 0 0 3px #ecebff}

/* ---------- card grid ---------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search input{padding-left:34px}
.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#a3aabc;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
  background:#fbfbfe;color:var(--ink);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:#c3bffd;background:#fff;box-shadow:0 0 0 3px #f0efff}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card-tile{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
.card-tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px -16px rgba(16,24,40,.4)}
.card-tile .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#eef1fb,#e6efec);position:relative;
  display:grid;place-items:center;overflow:hidden}
.card-tile .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-tile .thumb .ph{font-size:40px;opacity:.55}
.card-tile .thumb .due{position:absolute;left:8px;top:8px}
.card-tile .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.card-tile .word{font-size:17px;font-weight:800;letter-spacing:-.2px;word-break:break-word}
.card-tile .read{font-size:12.5px;color:var(--muted)}
.card-tile .mean{font-size:13px;color:#334155;font-weight:600}
.card-tile .foot{display:flex;gap:4px;align-items:center;margin-top:8px}
.empty{text-align:center;padding:46px 18px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}

/* ---------- review ---------- */
.review-wrap{max-width:620px;margin:0 auto}
.rev-progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:7px;background:#e7eaf4;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#8b7bff);border-radius:999px;transition:.3s}
.flashcard{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.flashcard .hero{aspect-ratio:16/10;background:linear-gradient(135deg,#eef1fb,#e7f3ee);display:grid;place-items:center;overflow:hidden;position:relative}
.flashcard .hero img{width:100%;height:100%;object-fit:cover}
.flashcard .hero.noimg{aspect-ratio:auto;height:104px;background:linear-gradient(135deg,#eef1fb,#e7f3ee)}
.flashcard .hero.noimg .ph{font-size:36px;opacity:.6}
.flashcard .hero .ph{font-size:64px;opacity:.5}
.flashcard .cont{padding:20px}
.flashcard .word{font-size:34px;font-weight:800;letter-spacing:-.8px;word-break:break-word}
.flashcard .word.mm{line-height:1.5;font-size:30px}
.flashcard .read{font-size:15px;color:#4b5563;margin-top:6px}
.flashcard .read b{color:var(--brand)}
.answer{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.answer .mean{font-size:24px;font-weight:800}
.answer .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.rev-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.rev-actions .btn{justify-content:center;padding:14px 8px;font-size:14.5px;flex-direction:column;gap:2px}
.rev-actions .btn small{font-weight:500;font-size:11px;opacity:.85}
.speak-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow)}
.speak-btn:hover{background:var(--brand-soft);border-color:#cfcaff}
.speed-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f7f8fd;border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;margin-top:10px}
.speed-ctl .chips{gap:4px}
.speed-ctl .chip{padding:3px 9px;font-size:12px}
.speed-ctl input[type=range]{height:16px;min-width:90px;flex:1}
/* สีตามหลักภาษา */
.w-initial{color:#2563eb;font-weight:inherit}
.w-final{color:#dc2626}
.w-cluster{color:#7c3aed}
.w-lead{color:#db2777}
.w-vowel{color:#059669}
.w-tone{color:#ea580c}
.w-silent{color:#94a3b8;text-decoration:line-through;text-decoration-thickness:1px}
.w-num{color:#0f766e}
.w-other{color:#64748b}
.w-hi{color:#e11d48}
.w-mid{color:#2563eb}
.w-lo{color:#059669}
.w-lv{color:#059669}
.w-lv2{color:#0d9488;font-weight:600}
.w-lc{color:#2563eb}
.w-lcl{color:#7c3aed}
.w-lf{color:#dc2626}
.w-ls{color:#94a3b8;text-decoration:line-through;text-decoration-thickness:1px}
.af-ok{color:#0f9d76 !important}
.af-warn{color:#c2760a !important}
.af-info{color:#6b7490 !important}
.explain-row{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #eef0f8;color:#374151}
.explain-row span:first-child{font-weight:700;color:#111827}
.legend{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:12px;color:#4b5563;margin:0 4px 4px 0}
.legend i{font-style:normal;font-weight:800;font-size:14px;min-width:14px;text-align:center}
.color-preview{margin-top:8px;padding:10px 12px;border:1px dashed #d8dcf0;border-radius:11px;background:#fbfcff;
  font-size:20px;font-weight:800;letter-spacing:.5px;min-height:44px}
.sound-row{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;background:#fbfbfe}
.sound-row .sr-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sr-num{width:70px;text-align:center;font-weight:800;padding:6px 6px;border-radius:9px;font-size:13.5px}
.sr-slider{display:flex;align-items:center;gap:8px;margin-top:8px}
.sr-slider input[type=range]{flex:1;accent-color:#4f46e5;height:18px}
.sr-val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.sr-bar{height:6px;background:#e7eaf4;border-radius:999px;overflow:hidden;margin-top:6px}
.sr-bar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#8b7bff);border-radius:999px;transition:.15s}
.voice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.voice-card{border:1.5px solid var(--line);background:#fbfbfe;border-radius:14px;padding:11px 12px;text-align:left;
  display:flex;flex-direction:column;gap:2px;transition:.15s;color:var(--ink)}
.voice-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.voice-card.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px #f0efff}
.voice-card .ic{font-size:20px;line-height:1.2}
.voice-card b{font-size:13.5px}
.voice-card small{font-size:11px;color:var(--muted);line-height:1.35}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);
  display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:20px;width:100%;max-width:660px;max-height:92vh;overflow:auto;
  box-shadow:0 30px 70px -20px rgba(15,23,42,.5)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;z-index:2}
.modal .body{padding:16px 18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:#feffff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:#5b647c;margin-bottom:5px}
.field .hint{font-size:11.5px;color:#98a0b6;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fbfbfe;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--brand-soft);border-color:#cfcaff;color:var(--brand)}
.imgpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgpick .prev{width:96px;height:96px;border-radius:12px;border:1px solid var(--line);background:#f2f4fb;
  display:grid;place-items:center;overflow:hidden;font-size:26px;color:#a9b0c4}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.seedpick{display:flex;gap:6px;gap:6px;flex-wrap:wrap;margin-top:8px}
.seedpick button{width:46px;height:46px;border-radius:10px;border:2px solid transparent;padding:0;overflow:hidden;background:#eef1fb}
.seedpick button img{width:100%;height:100%;object-fit:cover}
.seedpick button.on{border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 16px 40px -14px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid #f4e0bd;
  color:#7a4c07;padding:10px 13px;border-radius:12px;font-size:12.5px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv .k{color:var(--muted)}

@media(max-width:760px){
  .grid-stats{grid-template-columns:1fr 1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 0 100vmax rgba(15,23,42,0)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(15,23,42,.25)}
  .main{padding:14px 14px 70px}
  .menu-btn{display:inline-flex}
  .row2,.row3{grid-template-columns:1fr}
  .flashcard .word{font-size:28px}
  .rev-actions{grid-template-columns:repeat(4,1fr);gap:7px}
  .rev-actions .btn{font-size:12.5px;padding:12px 4px}
}
.sb-overlay{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:69;opacity:0;pointer-events:none;
  transition:opacity .22s ease;backdrop-filter:blur(1px)}
body.sb-open .sb-overlay{opacity:1;pointer-events:auto}
@media(min-width:761px){ .sb-overlay{display:none} }

/* แถบนำทางล่างสำหรับมือถือ */
.mobnav{display:none}
@media(max-width:760px){
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .mobnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;
    gap:2px;font-size:10.5px;color:#7b849b;padding:5px 2px;border-radius:10px;position:relative}
  .mobnav button b{font-size:18px;font-weight:400;line-height:1}
  .mobnav button.active{color:var(--brand);background:var(--brand-soft)}
  .mobnav button .dot{position:absolute;top:2px;right:calc(50% - 18px);background:var(--danger);color:#fff;
    font-size:9.5px;font-weight:800;border-radius:999px;padding:0 5px;line-height:14px}
  .main{padding-bottom:96px !important}
}
@media(max-width:820px){
  .panel{overflow-x:auto}
  .panel table.tbl{min-width:560px}
  table.tbl th,table.tbl td{padding:8px 7px}
  .topbar .btn{padding:8px 11px;font-size:13px}
}
@media(max-width:620px){ .voice-grid{grid-template-columns:1fr 1fr} }

/* ---------- มือถือ / iPad: ทัชง่าย ไม่ซูม ---------- */
@media (hover:none),(max-width:760px){
  input,select,textarea{font-size:16px}            /* กัน iOS ซูมเมื่อโฟกัส */
  .btn{min-height:42px}
  .icon-btn{min-width:40px;min-height:40px}
  .chip{min-height:34px;padding:7px 12px}
  .nav button{min-height:44px}
  .cat-row{min-height:42px}
  .btn:hover,.card-tile:hover,.voice-card:hover{transform:none}   /* ไม่ให้กระพริบค้างบนทัช */
}
@media(max-width:640px){
  .backdrop{padding:0;align-items:stretch}
  .modal{max-width:none;height:100dvh;max-height:100dvh;border-radius:0;display:flex;flex-direction:column}
  .modal header{position:sticky;top:0;z-index:3;background:#fff;padding-top:calc(14px + env(safe-area-inset-top))}
  .modal .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal footer{position:sticky;bottom:0;z-index:3;background:#fff;
    padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .topbar{gap:8px;margin-bottom:12px}
  .topbar .hide-sm{display:none}
  .h1{font-size:18px}
  .sub{font-size:12px}
  .kv{grid-template-columns:104px 1fr}
  .flashcard .word{font-size:24px}
  .rev-actions{grid-template-columns:1fr 1fr 1fr}
  .sound-row .sr-head{flex-wrap:wrap;gap:6px}
  .sr-num{width:74px}
}
@media(max-width:520px){
  .topbar > .btn{display:none}          /* ใช้ปุ่มในเมนูล่างแทน (＋ เพิ่มคำ / สำรองข้อมูลอยู่ในเมนู) */
  .topbar .menu-btn{display:inline-flex}
  .topbar{align-items:flex-start}
}
@media(max-width:400px){
  .cards-grid{grid-template-columns:1fr}
  .grid-stats{grid-template-columns:1fr}
  .topbar .h1{font-size:16.5px}
}
/* จอเตี้ย (มือถือแนวนอน) */
@media(max-height:520px) and (max-width:760px){
  .flashcard .hero{aspect-ratio:auto;height:120px}
  .sidebar{padding-top:14px}
}
/* iPad แนวตั้ง/แนวนอน: ระยะห่างพอเหมาะ ไม่กว้างเกิน */
@media(min-width:700px) and (max-width:1100px){
  .main{padding:18px 20px 90px}
  .sidebar{width:250px;flex:0 0 250px}
}
/* แท็บเล็ตแนวตั้ง: ย่อตารางให้พอดีจอ ไม่ต้องเลื่อนแนวนอน */
@media(min-width:761px) and (max-width:900px){
  .panel table.tbl{min-width:460px}
  table.tbl th,table.tbl td{padding:7px 6px;font-size:12.5px}
  .grid-stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:24px}
}
@media(max-width:520px){
  .grid-stats{grid-template-columns:1fr 1fr}
  .cards-grid{grid-template-columns:1fr 1fr;gap:10px}
  .h1{font-size:18px}
  .stat .v{font-size:22px}
  .rev-actions .btn small{display:none}
}
/* หน้าทบทวนบนมือถือ: ไม่ตัดปุ่มด้านขวา และเห็นเนื้อหาสำคัญเร็วขึ้น */
@media(max-width:640px){
  .main{padding-left:8px;padding-right:8px;padding-top:10px}
  .review-wrap{width:100%;max-width:none}
  .rev-progress{margin:0 4px 8px;gap:7px}
  .flashcard{border-radius:16px}
  .flashcard .hero{aspect-ratio:auto;height:150px}
  .flashcard .hero.noimg{height:76px}
  .flashcard .cont{padding:14px 12px}
  .flashcard .word{font-size:25px;line-height:1.25}
  .flashcard .read{font-size:13.5px;line-height:1.45}
  .review-tools{display:grid !important;grid-template-columns:auto 1fr 1fr;gap:6px !important}
  .review-tools .speak-btn{grid-row:span 2;width:44px;height:44px}
  .review-tools .btn{min-height:38px;padding:7px 8px;font-size:12px;white-space:normal}
  .review-tools .spacer{display:none}
  .review-tools .review-color-help{display:none}
  .speed-ctl{padding:7px;gap:5px;overflow:visible}
  .speed-ctl .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:5px}
  .speed-ctl .chip{width:100%;padding:6px 3px;min-height:34px;font-size:11.5px}
  .speed-ctl > .tiny:first-child{width:100%}
  .speed-ctl > [data-sound-summary]{font-size:10.5px}
  .review-voice-row{display:none}
  .rev-actions{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:6px;
    position:sticky;bottom:76px;z-index:30;padding:7px;background:rgba(247,248,253,.96);
    backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 24px rgba(30,41,59,.15)}
  .rev-actions .btn{min-width:0;min-height:46px;font-size:12px;padding:8px 4px}
  .rev-actions .btn small{display:block;font-size:9.5px}
}
@media(max-width:380px){
  .flashcard .hero{height:132px}
  .review-tools{grid-template-columns:auto 1fr}
  .review-tools .speak-btn{grid-row:span 3}
  .flashcard .cont{padding:12px 10px}
}
/* หน้าจัดการหมวดหมู่แบบ responsive */
.cat-manage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eef0f6}
.cat-manage-row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px calc(14px + var(--cat-depth)*22px);border-bottom:1px solid #eef0f6;background:#fff}
.cat-manage-row:hover{background:#fafbff}
.cat-manage-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.cat-manage-icon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:10px;background:#f4f5fb;font-size:18px}
.cat-manage-info{min-width:0;flex:1}
.cat-manage-name{font-weight:750;display:flex;align-items:center;gap:6px;min-width:0;word-break:break-word}
.cat-manage-meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
.cat-manage-actions{display:flex;gap:7px;flex-shrink:0}
.cat-manage-actions .btn{white-space:nowrap}
@media(max-width:640px){
  .cat-manage-head{align-items:stretch;flex-direction:column;padding:14px 12px !important}
  .cat-manage-head .btn{width:100%;justify-content:center}
  .cat-manage-row{display:block;padding:13px 12px;border-left:3px solid #d9d7ff}
  .cat-manage-main{align-items:flex-start}
  .cat-manage-icon{width:34px;height:34px;flex-basis:34px}
  .cat-manage-name{font-size:14px}
  .cat-manage-meta{font-size:11px;gap:5px}
  .cat-manage-actions{display:grid;grid-template-columns:1fr 1fr;margin:10px 0 0 44px;gap:7px}
  .cat-manage-actions .btn{width:100%;justify-content:center;min-height:38px;font-size:12px}
}
/* ตัวเลือกโหมดสี: อ่านง่ายบนมือถือ */
.color-mode-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){
  .color-mode-grid{grid-template-columns:1fr !important;gap:7px}
  .color-mode-grid .voice-card{display:grid;grid-template-columns:minmax(105px,auto) 1fr;align-items:center;
    gap:10px;padding:10px 12px;min-height:58px;border-radius:12px}
  .color-mode-grid .voice-card b{font-size:13.5px;white-space:nowrap;text-align:left}
  .color-mode-grid .voice-card small{font-size:11.5px;line-height:1.4;text-align:left}
  .color-mode-grid .voice-card.on{box-shadow:inset 3px 0 0 var(--brand),0 0 0 2px #f0efff}
}
@media(max-width:360px){
  .color-mode-grid .voice-card{grid-template-columns:1fr;gap:3px}
  .color-mode-grid .voice-card b{white-space:normal}
}
textarea.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 27px,#eef1f9 27px 28px);background-position:0 12px}
.sent-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--line,#e5e7eb);border-radius:11px;margin-bottom:7px;background:#fff}
.sent-row:hover{border-color:#c7d2fe;background:#f8faff}
.sent-en{font-weight:600;font-size:13.5px;line-height:1.5;word-break:break-word}
.sent-th{font-size:13px;color:#475569;line-height:1.55;word-break:break-word}
.sent-btns{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.sent-row{flex-direction:column;align-items:stretch}.sent-btns{justify-content:flex-start}}
</style>

const pad2 = n => String(n).padStart(2, '0');
function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return fmtDate(new Date()); }
function parseDate(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function dueIn(d) { return daysBetween(todayStr(), d); }
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(s) {
  if (!s) return '—';
  const d = parseDate(s);
  return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function dueText(s) {
  const n = dueIn(s);
  if (n < 0) return 'เลยกำหนด ' + (-n) + ' วัน';
  if (n === 0) return 'ครบกำหนดวันนี้';
  if (n === 1) return 'พรุ่งนี้';
  return 'อีก ' + n + ' วัน';
}

/* ---------------- ที่เก็บข้อมูล (IndexedDB → localStorage → memory) ---------------- */
const DB_NAME = 'flashcards-db', STORE = 'kv', KEY = 'state';
const APP_VERSION = '2.2.0';
const LS_KEY = 'flashcard-state', LS_BAK = 'flashcard-state-prev';
let lastSavedAt = 0;
let dbP = null, memOnly = null;
function openDB() {
  if (dbP) return dbP;
  dbP = new Promise((res, rej) => {
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    req.onupgradeneeded = () => { try { req.result.createObjectStore(STORE); } catch (e) {} };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
    req.onblocked = () => rej(new Error('blocked'));
    setTimeout(() => rej(new Error('timeout')), 3000);
  });
  return dbP;
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}

async function loadState() {
  let fromIdb = null, fromLs = null;
  try { fromIdb = await idbGet(KEY); } catch (e) { /* ignore */ }
  try { const s = localStorage.getItem('flashcard-state'); if (s) fromLs = JSON.parse(s); } catch (e) {}
  let raw = null;
  if (fromIdb && fromLs) raw = (Number(fromLs.savedAt) || 0) > (Number(fromIdb.savedAt) || 0) ? fromLs : fromIdb;
  else raw = fromIdb || fromLs;
  if (raw && raw.cards && raw.cats) {
    // อัปเดตเวอร์ชันแอป → เก็บสำเนาข้อมูลเดิมไว้ก่อนแปลงโครงสร้าง (กันข้อมูลหาย)
    try {
      if (raw.appVersion !== APP_VERSION) localStorage.setItem(LS_BAK, JSON.stringify(raw));
    } catch (e) {}
    const oldS = raw.settings || {};
    state = raw;
    state.settings = Object.assign(defaultState().settings, oldS);
    // ย้ายค่าความเร็วแบบเก่า (0.9 = 90%) มาเป็นเปอร์เซ็นต์
    if (oldS.ratePct === undefined && oldS.rate !== undefined) {
      state.settings.ratePct = Math.max(0, Math.min(500, Math.round((Number(oldS.rate) || 0.9) * 100 / 50) * 50));
    }
    if (!VOICE_PROFILES.some(v => v.id === state.settings.voice)) state.settings.voice = 'us-f';
    ['ratePct', 'volumePct', 'pitchPct'].forEach(k => {
      const meta = SOUND_META[k];
      if (!isFinite(Number(state.settings[k]))) state.settings[k] = 100;
      const rel = Math.max(meta.min, Math.min(meta.max,
        Math.round((Number(state.settings[k]) - 100) / (meta.step || SOUND_STEP)) * (meta.step || SOUND_STEP)));
      state.settings[k] = 100 + rel;
    });
  }
  else state = defaultState();
  // ตรวจสิทธิ์การบันทึก
  await saveState(true);
}
let saveTimer = null;
/* เก็บสำเนาก่อนหน้าไว้เสมอ — ถ้าข้อมูลใหม่ "น้อยลง" หรือผ่านไป 10 นาที จะเก็บของเดิมไว้ให้กู้คืน */
function rotateBackup(prevRaw) {
  if (!prevRaw) return;
  try {
    const prev = JSON.parse(prevRaw);
    const bakRaw = localStorage.getItem(LS_BAK);
    const bak = bakRaw ? JSON.parse(bakRaw) : null;
    const prevN = (prev.cards || []).length, bakN = ((bak && bak.cards) || []).length;
    const old = !bak || (Date.now() - (Number(bak.savedAt) || 0) > 10 * 60 * 1000);
    if (!bak || prevN > bakN || old) localStorage.setItem(LS_BAK, prevRaw);
  } catch (e) {}
}
function saveState(immediate) {
  clearTimeout(saveTimer);
  const run = async () => {
    const snapshot = JSON.parse(JSON.stringify(state));
    snapshot.savedAt = Date.now();
    snapshot.appVersion = APP_VERSION;
    let lsOK = false;
    try {
      const prevRaw = localStorage.getItem(LS_KEY);
      rotateBackup(prevRaw);
      localStorage.setItem(LS_KEY, JSON.stringify(snapshot));
      lsOK = true;
    } catch (e) {
      // พื้นที่เต็ม → ทิ้งสำเนารองแล้วลองใหม่
      try { localStorage.removeItem(LS_BAK); localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); lsOK = true; } catch (e2) {}
    }
    lastSavedAt = snapshot.savedAt;
    updateSaveInfo();
    try { await idbSet(KEY, snapshot); ui.storageOK = true; return; } catch (e) {}
    ui.storageOK = lsOK;
    updateSaveInfo();
  };
  if (immediate) return run();
  saveTimer = setTimeout(run, 250);
}

function timeText(ts) {

  const d = new Date(Number(ts));
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + ' · ' + thaiDate(todayStr()) ;
}

function getAutoBackup() {
  try { const r = localStorage.getItem(LS_BAK); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function restoreAutoBackup() {
  const b = getAutoBackup();
  if (!b || !b.cards || !b.cards.length) { toast('ไม่พบสำเนาสำรองให้กู้คืน'); return; }
  const when = b.savedAt ? timeText(b.savedAt) : 'ไม่ทราบเวลา';
  const msg = 'กู้คืนข้อมูลสำรองจาก ' + when + ' (' + b.cards.length + ' ใบ)?\nข้อมูลปัจจุบัน ' +
              state.cards.length + ' ใบจะถูกแทนที่ (สำรองไว้ให้ก่อนแล้ว)';
  if (!confirm(msg)) return;

  saveState(true); render(); toast('กู้คืนสำเนาสำรองแล้ว · ' + state.cards.length + ' ใบ');
}
function clearAutoBackup() {
  try { localStorage.removeItem(LS_BAK); } catch (e) {}

/* ---------------- ตัวช่วยหมวดหมู่ ---------------- */
function catById(id) { return state.cats.find(c => c.id === id); }
function childrenOf(id) { return state.cats.filter(c => c.parentId === id); }
function descendants(id) {
  const out = [];
  const walk = pid => childrenOf(pid).forEach(c => { out.push(c); walk(c.id); });
  walk(id);
  return out;
}
function isHiddenCat(id) {
  let c = catById(id), guard = 0;
  while (c && guard++ < 20) { if (c.hidden) return true; c = c.parentId ? catById(c.parentId) : null; }
  return false;
}
function catPath(id) {
  const parts = []; let c = catById(id), guard = 0;
  while (c && guard++ < 20) { parts.unshift(c.name); c = c.parentId ? catById(c.parentId) : null; }
  return parts.join(' › ');
}
function catIdsIn(id) { return [id, ...descendants(id).map(c => c.id)]; }
function catsIndented(includeHidden = true) {
  const out = [];
  const walk = (parent, depth) => {
    state.cats.filter(c => c.parentId === parent).forEach(c => {
      if (includeHidden || !isHiddenCat(c.id)) out.push({ cat: c, depth });
      walk(c.id, depth + 1);
    });
  };
  walk(null, 0);
  return out;
}
function cardCount(catId) { return state.cards.filter(c => catIdsIn(catId).includes(c.catId)).length; }
function visibleCards() { return state.cards.filter(c => !isHiddenCat(c.catId)); }
function dueCards() { const t = todayStr(); return visibleCards().filter(c => (c.due || t) <= t); }

/* แยกอักขระไทยเป็นหน่วยตามโครงสร้างพยางค์ */
function thTokens(text, mode) {
  const chars = Array.from(text);
  const out = [];
  let start = true, hasVowel = false, hasFinal = false, leadJust = false;
  const tri = (c) => TH_HIGH.includes(c) ? 'hi' : TH_MID.includes(c) ? 'mid' : TH_LOW.includes(c) ? 'lo' : 'other';
  const consKind = (c, base) => mode === 'triyang' ? tri(c) : base;

  for (let i = 0; i < chars.length; i++) {
    const c = chars[i], n = chars[i + 1];

    if (TH_NUM.includes(c)) { out.push([c, 'num']); continue; }
    if (TH_TONE.includes(c)) { out.push([c, 'tone']); continue; }
    if (c === TH_SILENT_MARK) {
      for (let k = out.length - 1; k >= 0; k--) {
        if (['initial', 'final', 'cluster', 'hi', 'mid', 'lo'].indexOf(out[k][1]) >= 0) { out[k][1] = 'silent'; break; }
      }
      out.push([c, 'silent']);
      continue;
    }
    if (TH_VOW.includes(c)) {
      if (TH_LEAD_VOW.includes(c)) { start = true; hasVowel = false; hasFinal = false; leadJust = false; }
      else hasVowel = true;
      out.push([c, 'vowel']);
      continue;
    }
    if (TH_CONS.includes(c)) {
      if (hasFinal) { start = true; hasVowel = false; hasFinal = false; leadJust = false; }
      // ว ในสระ ัว (กล้วย / ช่วย / ตัว) และ อ ในสระ ือ/โอ (หนังสือ / พ่อ / หรือ) เป็นส่วนของสระ
      if (!start && c === 'อ') {
        const newSyl = n && (TH_FOLLOW_VOW.includes(n) || TH_LEAD_VOW.includes(n));
        if (!newSyl) { out.push([c, 'vowel']); continue; }
      }
      if (!start && c === 'ว') {
        let k = out.length - 1;
        while (k >= 0 && out[k][1] === 'tone') k--;
        const base = k >= 0 ? out[k][0] : '';
        if (base === 'ั' || (n && TH_CONS.includes(n))) { out.push([c, 'vowel']); continue; }
      }
      if (start) {
        // อักษรนำ: ห + พยัญชนะอื่น, อ + ย
        if ((c === 'ห' && n && TH_CONS.includes(n)) || (c === 'อ' && n === 'ย')) {
          out.push([c, consKind(c, 'lead')]); start = true; leadJust = true; continue;
        }
        // อักษรควบกล้ำ: พยัญชนะต้น + ร / ล / ว
        if (!leadJust && n && CLUSTER_SECOND.includes(n) && CLUSTER_FIRST.includes(c)) {
          out.push([c, consKind(c, 'cluster')]); out.push([n, consKind(n, 'cluster')]);
          i++; start = false; hasVowel = false; continue;
        }
        out.push([c, consKind(c, 'initial')]); start = false; leadJust = false; continue;
      }
      // อยู่หลังพยัญชนะต้นแล้ว
      if (n && TH_FOLLOW_VOW.includes(n)) {   // ตามด้วยสระ → ขึ้นพยางค์ใหม่
        out.push([c, consKind(c, 'initial')]); start = false; hasVowel = false; continue;
      }
      out.push([c, consKind(c, 'final')]); hasFinal = true; continue;
    }
    out.push([c, 'other']);
  }
  return out;
}

/* แยกอักษรละติน: สระ / พยัญชนะ */
/* ---------- ภาษาอังกฤษ: สระ / สระประสม / ควบกล้ำ / ตัวสะกด / ตัวไม่ออกเสียง ---------- */
const EN_VOWELS = 'aeiou';
const EN_VOWEL_TEAMS = ['ai', 'ay', 'ea', 'ee', 'ei', 'ie', 'oa', 'oe', 'oo', 'ou', 'ow', 'oi', 'oy', 'au', 'aw', 'ew', 'ue', 'ui', 'ey'];
const EN_CONS_PAIRS = ['sh', 'ch', 'th', 'ph', 'wh', 'ck', 'ng', 'qu', 'gh',
  'bl', 'br', 'cl', 'cr', 'dr', 'fl', 'fr', 'gl', 'gr', 'pl', 'pr', 'sc', 'sk', 'sl', 'sm', 'sn', 'sp', 'st', 'sw', 'tr', 'tw'];
const EN_CONS_TRIPLES = ['str', 'spr', 'scr', 'spl', 'squ', 'thr', 'shr', 'chr'];

/* หาตำแหน่งตัวอักษรที่ไม่ออกเสียง (knight, write, climb, light, cake) */
function silentIndexes(w) {
  const sil = new Set();
  if (/^(kn|wr|gn|ps|pn)/.test(w)) sil.add(0);
  if (/mb$/.test(w) && w.length > 2) sil.add(w.length - 1);
  if (w.length > 2 && /[^aeiou]e$/.test(w) && /[aeiou]/.test(w.slice(0, -1))) sil.add(w.length - 1);
  let gi = w.indexOf('gh');
  while (gi >= 0) {
    const before = w[gi - 1] || '';
    const after = w[gi + 2] || '';
    if (/[aeiou]/.test(before) && (after === 't' || after === '')) { sil.add(gi); sil.add(gi + 1); }
    gi = w.indexOf('gh', gi + 1);
  }
  return sil;
}

/* แยกคำอังกฤษเป็นหน่วยเสียงย่อยเพื่อระบายสี */
function enTokens(text) {
  const out = [];
  const parts = text.match(/[A-Za-z']+|[^A-Za-z']+/g) || [text];
  parts.forEach(part => {
    if (!/[A-Za-z]/.test(part)) { Array.from(part).forEach(ch => out.push([ch, 'other'])); return; }
    const w = part.toLowerCase();
    const sil = silentIndexes(w);
    let i = 0;
    while (i < w.length) {
      if (sil.has(i)) { out.push([part[i], 'ls']); i++; continue; }
      const three = w.substr(i, 3), two = w.substr(i, 2);
      if (three === 'igh') { out.push([part[i], 'lv2'], [part[i + 1], 'lv2'], [part[i + 2], 'lv2']); i += 3; continue; }
      if (EN_VOWEL_TEAMS.indexOf(two) >= 0) { out.push([part[i], 'lv2'], [part[i + 1], 'lv2']); i += 2; continue; }
      // พยัญชนะคู่/สามตัวที่อยู่ท้ายคำ ถือเป็นตัวสะกด (strong → ng, back → ck)
      const endAt = (n) => {
        const e = i + n;
        return e === w.length || (e === w.length - 1 && sil.has(w.length - 1));
      };
      if (EN_CONS_TRIPLES.indexOf(three) >= 0) {
        const k = endAt(3) ? 'lf' : 'lcl';
        out.push([part[i], k], [part[i + 1], k], [part[i + 2], k]); i += 3; continue;
      }
      if (EN_CONS_PAIRS.indexOf(two) >= 0) {
        const k = endAt(2) ? 'lf' : 'lcl';
        out.push([part[i], k], [part[i + 1], k]); i += 2; continue;
      }
      const ch = w[i];
      if (EN_VOWELS.indexOf(ch) >= 0) { out.push([part[i], 'lv']); i++; continue; }
      // y ที่ตามหลังพยัญชนะทำหน้าที่เป็นสระ (happy, city, my, physics)
      if (ch === 'y' && i > 0 && EN_VOWELS.indexOf(w[i - 1]) < 0) { out.push([part[i], 'lv']); i++; continue; }
      const isLast = (i === w.length - 1) || (i === w.length - 2 && sil.has(w.length - 1));
      out.push([part[i], isLast ? 'lf' : 'lc']);
      i++;
    }
  });
  return out;
}

/* คืนค่าเป็น HTML ที่ระบายสีแล้ว */
function colorize(text, mode) {
  if (!text) return '';
  mode = mode || (state.settings && state.settings.colorMode) || 'off';
  if (mode === 'off') return esc(text);
  const isThai = /[\u0E00-\u0E7F]/.test(text);
  const isLatin = /[a-zA-Z]/.test(text);
  if (!isThai && !isLatin) return esc(text);
  const tokens = isThai ? thTokens(text, mode) : enTokens(text);
  return tokens.map(([ch, kind]) => `<span class="w-${kind}">${esc(ch)}</span>`).join('');
}
function cw(text) { return colorize(text, state.settings.colorMode); }            // คำศัพท์
function cr(text) { return state.settings.colorReadings === false ? esc(text) : cw(text); }  // คำอ่าน

/* คำอธิบายสี (legend) — รองรับไทย/อังกฤษ และบังคับโหมดได้ */
function legendHTML(lang, forceMode) {
  const mode = forceMode || state.settings.colorMode;
  if (mode === 'off' && !forceMode) return '<span class="tiny muted">ยังปิดสีอยู่ — เลือกโหมดด้านบนเพื่อดูคำอธิบายสี</span>';
  const build = (keys, sample) => keys.map(k =>
    `<span class="legend"><i class="w-${k}">${sample[k] || '·'}</i>${COLOR_KINDS[k].name}</span>`).join('');
  if (lang === 'en') {
    return build(['lv', 'lv2', 'lc', 'lcl', 'lf', 'ls'],
      { lv: 'a', lv2: 'ea', lc: 'n', lcl: 'sh', lf: 't', ls: 'e' });
  }
  if (lang === 'tri') return build(['hi', 'mid', 'lo'], { hi: 'ข', mid: 'ก', lo: 'ค' });
  return build(['initial', 'final', 'cluster', 'lead', 'vowel', 'tone', 'silent'],
    { initial: 'ก', final: 'ง', cluster: 'กร', lead: 'หม', vowel: 'า', tone: '่', silent: '์' });
}

/* ---------------- อ่านออกเสียง ---------------- */
let currentAudio = null;
let slowTimer = null, slowToken = 0;
function stopSlowChain() {
  slowToken++;
  if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
}
function stopAudio() {
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }

}
/* ============ ตั้งค่าเสียง: อัตรา / ระดับเสียง / ระดับเสียงสูงต่ำ ============
   ค่าที่เก็บ: 100 = เสียงปกติ · ผู้ใช้เห็นเป็นเปอร์เซ็นต์ติดลบ/บวก (0% = ปกติ) · ความเร็วปรับละเอียด 5% */
const SOUND_STEP = 10;                     // ค่าเริ่มต้น (ใช้เมื่อไม่ได้ระบุ step ใน meta)
const PCT_DEF = 100;                       // ค่าที่เก็บ = 100 คือเสียงปกติ
const SOUND_META = {
  ratePct:   { label: 'อัตรา (ความเร็ว)',     icon: '⚡', min: -95, max: 400, step: 5,
               hint: '0% = ความเร็วปกติ · ค่าลบ = ช้าลง ปรับละเอียดทีละ 5% (ต่ำสุด −95% = อ่านทีละคำ) · ค่าบวก = เร็วขึ้น (สูงสุด +400%)' },
  volumePct: { label: 'ระดับเสียง (ดัง–เบา)', icon: '🔊', min: -100, max: 400, step: 10,
               hint: '0% = ปกติ · ค่าลบ = เบาลง (−100% = เงียบ) · ค่าบวก = ดังขึ้น (ตัวขยายเสียงอัตโนมัติ)' },
  pitchPct:  { label: 'ระดับเสียงสูงต่ำ',     icon: '🎚️', min: -95, max: 100, step: 5,
               hint: '0% = ปกติ · ค่าลบ = เสียงทุ้มลง (ต่ำสุด −90%) · ค่าบวก = เสียงแหลมขึ้น (สูงสุด +100%)' }
};
const SOUND_KEYS = Object.keys(SOUND_META);
const PCT_STEP = SOUND_STEP, PCT_MIN = -100, PCT_MAX = 400;   // เผื่อโค้ดเก่าที่ยังอ้างถึง

/* ค่าที่ผู้ใช้เห็น = เปอร์เซ็นต์เทียบกับเสียงปกติ (0 = ปกติ, ติดลบ/บวกได้) */
function pctOf(key) {
  const m = SOUND_META[key] || SOUND_META.ratePct;
  const st = m.step || SOUND_STEP;
  const raw = Number(state.settings && state.settings[key]);
  const rel = isFinite(raw) ? raw - 100 : 0;
  return Math.max(m.min, Math.min(m.max, Math.round(rel / st) * st));
}
function fmtPct(v) {
  const n = Math.round(Number(v) || 0);
  return (n > 0 ? '+' : '') + (n < 0 ? '−' + Math.abs(n) : n) + '%';
}
function pctText(key) { return fmtPct(pctOf(key)); }
function setPct(key, v, silent) {
  const m = SOUND_META[key];
  if (!m) return;
  const st = m.step || SOUND_STEP;
  const rel = Math.max(m.min, Math.min(m.max, Math.round((Number(v) || 0) / st) * st));
  state.settings[key] = 100 + rel;
  saveState();
  syncSoundUI();
  if (!silent) toast(m.label + ': ' + fmtPct(rel));
}
function adjustPct(key, delta) { setPct(key, pctOf(key) + delta); }
function resetPct(key) { setPct(key, 0); }
function resetAllSound() {
  SOUND_KEYS.forEach(k => state.settings[k] = PCT_DEF);
  saveState(); syncSoundUI(); render(); toast('รีเซ็ตเสียงกลับเป็นค่าปกติ (0%) แล้ว');
}
function syncSoundUI() {
  SOUND_KEYS.forEach(k => {
    const v = pctOf(k), m = SOUND_META[k];
    document.querySelectorAll('[data-pct-label="' + k + '"]').forEach(el => el.textContent = fmtPct(v));
    document.querySelectorAll('[data-pct-slider="' + k + '"]').forEach(el => { if (document.activeElement !== el) el.value = v; });
    document.querySelectorAll('[data-pct-fill="' + k + '"]').forEach(el => {
      el.style.width = Math.max(0, Math.min(100, (v - m.min) / (m.max - m.min) * 100)) + '%';
    });
  });
  document.querySelectorAll('[data-rate-chip]').forEach(el =>
    el.classList.toggle('on', Number(el.dataset.rateChip) === pctOf('ratePct')));
  document.querySelectorAll('[data-sound-summary]').forEach(el =>
    el.textContent = '⚡' + fmtPct(pctOf('ratePct')) + ' · 🔊' + fmtPct(pctOf('volumePct')) + ' · 🎚️' + fmtPct(pctOf('pitchPct')));
}
/* ตัวคูณจริงที่ส่งให้เสียง — จำกัดช่วงตามที่ API รับได้ */
function rateFactor()   { return Math.max(0.05, Math.min(10, (100 + pctOf('ratePct')) / 100)); }
function volumeFactor() { return Math.max(0,   Math.min(5,   (100 + pctOf('volumePct')) / 100)); }
function pitchFactor()  { return Math.max(0,   Math.min(2,   (100 + pctOf('pitchPct')) / 100)); }
function rate() { return rateFactor(); }
function rateText() { return pctText('ratePct'); }

function pickVoice(lang, gender, accent) {
  const voices = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  if (!voices.length) return null;
  const want = String(lang || 'en-US').toLowerCase().replace('_', '-');
  const prefix = want.slice(0, 2);
  const norm = v => String(v.lang || '').toLowerCase().replace('_', '-');
  const exact = voices.filter(v => norm(v) === want);
  const pool = exact.length ? exact : voices.filter(v => norm(v).indexOf(prefix) === 0);
  if (!pool.length) return null;
  const acc = accent ? String(accent).toLowerCase().replace('_', '-') : '';
  const score = v => {
    const n = String(v.name || '').toLowerCase();
    let sc = 0;
    if (gender === 'f' && FEMALE_KW.some(k => n.indexOf(k) >= 0)) sc += 4;
    if (gender === 'm' && MALE_KW.some(k => n.indexOf(k) >= 0)) sc += 4;
    if (acc && norm(v) === acc) sc += 6;                       // สำเนียงตรงเป๊ะ (เช่น en-US)
    if (acc && acc === 'en-us' && US_KW.test(n)) sc += 2;      // ชื่อเสียงอเมริกัน
    if (/natural|neural|premium|enhanced/.test(n)) sc += 2;

  // ช้ากว่าที่เอนจินรับ (rate ต่ำสุด 0.1) → อ่านทีละคำ เว้นจังหวะให้ฟังทัน

function viewTable() {
  const vis = visibleCards();
  const buckets = [
    { k: 'เลยกำหนด', test: n => n < 0 },
    { k: 'วันนี้', test: n => n === 0 },
    { k: 'พรุ่งนี้ (1 วัน)', test: n => n === 1 },
    { k: '2–3 วัน', test: n => n >= 2 && n <= 3 },
    { k: '4–7 วัน', test: n => n >= 4 && n <= 7 },
    { k: '8–14 วัน', test: n => n >= 8 && n <= 14 },
    { k: '15–30 วัน', test: n => n >= 15 && n <= 30 },
    { k: '31–60 วัน', test: n => n >= 31 && n <= 60 },
    { k: '61–90 วัน', test: n => n >= 61 && n <= 90 },
    { k: 'เกิน 90 วัน', test: n => n > 90 }
  ];
  const counts = buckets.map(b => vis.filter(c => b.test(dueIn(c.due))).length);

  const sorted = vis.slice().sort((a, b) => (a.due || '').localeCompare(b.due || '') || a.word.localeCompare(b.word));
  const rows = sorted.map(c => {
    const n = dueIn(c.due);
    const cls = n <= 0 ? 'danger' : n <= 3 ? 'warn' : 'ok';
    return `<tr>
      <td style="width:52px">${imgSrc(c) ? `<img src="${imgSrc(c)}" referrerpolicy="no-referrer" loading="lazy" style="width:44px;height:44px;border-radius:9px;object-fit:cover" alt="">` : `<div style="width:44px;height:44px;border-radius:9px;background:#eef1fb;display:grid;place-items:center">${placeholderEmoji(c)}</div>`}</td>
      <td><b>${cw(c.word)}</b>${c.leech ? ' <span class="pill danger">🩹 คำยาก</span>' : ''}${c.write ? ' <span title="มีข้อความในช่องเขียน">✍️</span>' : ''}<div class="tiny muted">${cr(c.readThai)} ${c.readEn ? '· ' + esc(c.readEn) : ''}</div></td>
      <td class="tiny">${esc(catPath(c.catId))}</td>
      <td><span class="dots">${INTERVALS.map((_, k) => `<i class="${k < (c.step || 0) ? 'on' : ''}"></i>`).join('')}</span></td>
      <td class="tiny">${c.step ? STEP_LABEL[c.step] : 'ยังไม่เริ่ม'}</td>
      <td class="tiny"><span class="pill ${cls}">${dueText(c.due)}</span><div class="muted">${thaiDate(c.due)}</div></td>
      <td class="tiny muted" title="${c.updated ? new Date(c.updated).toLocaleString('th-TH') : 'ยังไม่เคยแก้ไข'}">${c.updated ? thaiDate(new Date(c.updated).toISOString().slice(0, 10)) : '—'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn sm" onclick="speakCard('${c.id}')" title="ฟังเสียง">🔊</button>
        <button class="btn sm" onclick="openCardModal('${c.id}')">แก้ไข</button>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="panel pad" style="margin-bottom:14px">
      <h3 style="font-size:15px;margin-bottom:10px">สรุปตามช่วงเวลา</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px">
        ${buckets.map((b, i) => `
          <div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:${counts[i] ? '#fff' : '#fbfbfe'}">
            <div class="tiny muted">${b.k}</div>
            <div style="font-size:22px;font-weight:800">${counts[i]}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="panel" style="overflow:hidden">
      <div class="pad" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="font-size:15px">ตารางบัตรคำ (${vis.length} ใบ)</h3>
        <div class="spacer"></div>
        <button class="btn sm" onclick="exportCSV()">⬇︎ ส่งออก CSV</button>
      </div>
      <div style="max-height:70vh;overflow:auto">
        <table class="tbl">
          <thead><tr><th></th><th>คำศัพท์</th><th>หมวด</th><th>ความคืบหน้า</th><th>ขั้น</th><th>กำหนดทบทวน</th><th>อัปเดต</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="8" class="muted" style="text-align:center;padding:26px">ยังไม่มีบัตรคำ</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;

/* ---------------- ทบทวน ---------------- */
function buildQueue(limit) {
  const st = state.settings;
  const today = todayStr();
  let due = visibleCards().filter(c => !c.suspended && (!c.due || c.due <= today));
  /* แบบ Anki: งานค้าง/โอกาสจำต่ำมาก่อน, บัตรใหม่ถูกจำกัดต่อวัน */
  const reviews = due.filter(c => (c.reps || 0) > 0).sort((a,b) => {
    const oa = daysBetween(a.due || today, today), ob = daysBetween(b.due || today, today);
    return ob - oa || retrievability(a) - retrievability(b);
  }).slice(0, Number(st.reviewsPerDay || 200));
  const fresh = due.filter(c => !(c.reps || 0)).slice(0, Number(st.newPerDay || 20));
  let pool = reviews.concat(fresh);
  if (!pool.length) pool = visibleCards().filter(c=>!c.suspended).slice().sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0, limit || 10);
  if (limit) pool = pool.slice(0, Math.max(limit, reviews.length));
  return { ids: pool.map(c=>c.id), i:0, correct:0, again:0, total:pool.length };
}
function daysBetween(a,b) { return Math.max(0, Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)); }
function retrievability(c) {
  if (!(c.reps||0)) return 0;
  const elapsed = daysBetween(c.lastReview || c.created || todayStr(), todayStr());
  const stability = Math.max(.1, Number(c.stability || c.interval || 1));
  return Math.max(0, Math.min(1, Math.pow(1 + elapsed / (9 * stability), -1)));
}
function ankiIntervals(card) {
  const iv = Math.max(1, Number(card.interval || (card.step ? INTERVALS[Math.max(0,card.step-1)] : 1)));
  const ease = Math.max(1.3, Number(card.ease || 2.5));
  const retention = Math.max(.70, Math.min(.97, Number(state.settings.desiredRetention || 90)/100));
  const mod = Math.log(retention) / Math.log(.9); // retention สูง → ช่วงสั้นลง
  const overdue = daysBetween(card.due || todayStr(), todayStr());
  const bonus = Math.min(overdue, iv) * .5;
  return {
    again: 1,
    hard: Math.max(1, Math.round((iv * 1.2 + bonus*.25) * mod)),
    good: Math.max(2, Math.round((iv * ease + bonus*.5) * mod)),
    easy: Math.max(3, Math.round((iv * ease * 1.3 + bonus) * mod))
  };
}
function intervalLabel(days) { return days < 1 ? '<1 วัน' : days + ' วัน'; }
function startReview(force) {
  if (force && ui.session && ui.session.i < ui.session.ids.length) { render(); return; }
  ui.session = buildQueue(20);
  ui.revealed = false;
  ui.view = 'review';
  render();
}

/* ---------------- ✍️/⌨️ ช่องใต้บัตร: ฝึกพิมพ์ + จดโน้ต ---------------- */
function writePanelHTML(card) {
  const st = state.settings;

  /* ⌨️ โหมดฝึกพิมพ์: ช่องคำ + ช่องความหมาย */
  const showW = fields !== 'mean', showM = fields !== 'word';

/* --- ตรวจการพิมพ์เทียบกับคำ/ความหมาย --- */
function normWord(x) { return String(x == null ? '' : x).replace(/\u00A0/g, ' ').trim().replace(/\s+/g, ' '); }
function isThaiStr(x) { return /[\u0E00-\u0E7F]/.test(String(x)); }
function altList(target) {
  return String(target || '').split(/[\/,;·]|\sหรือ\s/).map(x => x.trim()).filter(Boolean);
}
function checkText(typed, target) {
  const alts = altList(target);
  const T = normWord(alts[0] || target);
  const P = normWord(typed);
  const ci = !isThaiStr(T);
  const eq = (x, y) => ci ? x.toLowerCase() === y.toLowerCase() : x === y;
  if (!P) return { state: 'idle', T, P, ci, alts };
  if (alts.some(a => eq(normWord(a), P))) return { state: 'ok', T, P, ci, alts };
  let best = { bad: -1, T };
  alts.forEach(a => {
    const t = normWord(a);
    let bad = -1;
    for (let i = 0; i < Math.max(t.length, P.length); i++) {
      const x = ci ? String(t[i] || '').toLowerCase() : t[i];
      const y = ci ? String(P[i] || '').toLowerCase() : P[i];
      if (x !== y) { bad = i; break; }
    }
    if (best.bad === -1 || bad > best.bad) best = { bad, T: t };
  });
  return { state: 'bad', T: best.T, P, ci, alts, bad: best.bad };
}
function checkBorder(typed, target) {
  const r = checkText(typed, target);
  return r.state === 'ok' ? '#10b981' : r.state === 'bad' ? '#ef4444' : '#d7dcec';
}
function checkFeedbackHTML(typed, target, peekKey) {
  const r = checkText(typed, target);
  const full = normWord(altList(target)[0] || '');
  const peek = ui.peekId === peekKey;
  const answerBox = peek
    ? `<span style="background:#eef2ff;color:#31399b;padding:1px 8px;border-radius:7px;font-weight:700">${esc(full)}</span>`
    : `<button class="btn sm ghost" onclick="togglePeekKey('${peekKey}')" style="padding:1px 8px">👀 ดูคำตอบ</button>`;
  if (r.state === 'idle') {
    return `<div class="tiny muted">พิมพ์ให้ตรงทุกตัวอักษร (ตัวเล็ก/ใหญ่ไม่สำคัญ) · ยังไม่ได้พิมพ์</div>`;
  }
  if (r.state === 'ok') {
    return `<div style="background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:8px 11px;font-weight:700">
      ✅ ถูกต้อง! “${esc(full)}” ครบทุกตัวอักษร</div>`;
  }
  const T = r.T, P = r.P;
  let cells = '';
  for (let i = 0; i < Math.max(T.length, P.length); i++) {
    const t = T[i], p = P[i];
    const good = p !== undefined && t !== undefined && (r.ci ? p.toLowerCase() === t.toLowerCase() : p === t);
    const bg = good ? '#dcfce7' : (p !== undefined ? '#fee2e2' : '#f1f5f9');
    const fg = good ? '#166534' : (p !== undefined ? '#991b1b' : '#94a3b8');
    cells += `<span style="display:inline-block;min-width:26px;text-align:center;background:${bg};color:${fg};border-radius:6px;padding:2px 5px;margin:0 1px;font-weight:700">${esc(p !== undefined ? p : t || '·')}</span>`;
  }
  const hint = (r.bad >= 0 && T[r.bad] !== undefined)
    ? `ตัวที่ ${r.bad + 1} ต้องเป็น “${esc(T[r.bad])}”${P[r.bad] !== undefined ? ' แต่พิมพ์ “' + esc(P[r.bad]) + '”' : ' (ยังขาดอยู่)'}`
    : (P.length > T.length ? 'พิมพ์เกินจำนวนตัวอักษร' : 'ยังพิมพ์ไม่ครบ');
  const extra = P.length > T.length ? `<div class="tiny" style="margin-top:6px;color:#b91c1c">พิมพ์เกิน ${P.length - T.length} ตัวอักษร</div>` : '';
  return `<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px 11px">
    <div style="font-weight:700;margin-bottom:6px">❌ ยังไม่ถูก — ${hint}</div>
    <div style="line-height:1.9">${cells}</div>${extra}
    <div class="tiny" style="margin-top:6px;color:#7f1d1d;display:flex;align-items:center;gap:6px">คำตอบ: ${answerBox}</div>
  </div>`;
}
function setWriteMode(v) { state.settings.writeMode = v; saveState(); render(); }
function setTypeFields(v) { state.settings.typeFields = v; saveState(); render(); }
function togglePeek() {
  const s = ui.session, id = s && s.ids[s.i];
  ui.peekId = (ui.peekId === id) ? null : id;
  render();
}
function togglePeekKey(key) { ui.peekId = (ui.peekId === key) ? null : key; render(); }
function clearTyped() {
  const s = ui.session, id = s && s.ids[s.i];
  const card = state.cards.find(c => c.id === id);
  if (card) { card.typed = ''; card.typedMean = ''; saveState(true); }
  render();
  const el = document.getElementById('w-type') || document.getElementById('w-mean');
  if (el) el.focus();
}
let typeTimer = null;
function onTypeInput(val, which) {
  const s = ui.session, id = s && s.ids[s.i];
  const card = state.cards.find(c => c.id === id);
  if (!card) return;
  const isMean = which === 'mean';
  const target = isMean ? card.mean : card.word;
  if (isMean) card.typedMean = val; else card.typed = val;
  card.updated = new Date().toISOString();
  const el = document.getElementById(isMean ? 'w-mean' : 'w-type');
  if (el) el.style.borderColor = checkBorder(val, target);
  const f = document.getElementById(isMean ? 'wFeedMean' : 'wFeed');
  if (f) f.innerHTML = checkFeedbackHTML(val, target, which + ':' + card.id);
  const r = checkText(val, target);
  if (r.state === 'ok') {
    const k = isMean ? 'meanOk' : 'typeOk';
    if (ui['counted_' + which] !== card.id) { ui['counted_' + which] = card.id; card[k] = (card[k] || 0) + 1; }
  } else ui['counted_' + which] = null;
  const stat = document.getElementById('wStat');
  if (stat) stat.textContent = (card.typeOk || card.meanOk) ? '⌨️ คำถูก ' + (card.typeOk || 0) + ' · ความหมายถูก ' + (card.meanOk || 0) : '';
  clearTimeout(typeTimer);
  const st2 = document.getElementById('wState');
  if (st2) st2.textContent = 'กำลังบันทึก…';
  typeTimer = setTimeout(() => {
    saveState(true);
    const e2 = document.getElementById('wState');
    if (e2) e2.textContent = 'บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  }, 450);
}

function setWritePanel(v) { state.settings.writePanel = v; saveState(); render(); }
function setWriteWhen(v) { state.settings.writeWhen = v; saveState(); render(); }
function setWriteSize(v) { state.settings.writeSize = v; saveState(); render(); }
let writeTimer = null;
function onWriteInput(val) {
  const s = ui.session;
  const id = s && s.ids[s.i];
  const card = state.cards.find(c => c.id === id);
  if (!card) return;
  card.write = val;
  card.updated = new Date().toISOString();

    const e2 = document.getElementById('wState');
    if (e2) e2.textContent = 'บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  }, 500);
}

function nextIntervalText(card) {
  const step = Math.min(7, (card.step || 0) + 1);
  return 'ไปขั้น ' + step + ' · ' + INTERVALS[step - 1] + ' วัน';
}
function revealAnswer() { ui.revealed = true; renderView(); }

function answer(quality) { // Anki: 0 Again, 1 Hard, 2 Good, 3 Easy
  const ses = ui.session;
  const card = state.cards.find(c => c.id === ses.ids[ses.i]);
  if (card) {
    if (state.settings.scheduler === 'anki') {
      const x = ankiIntervals(card);
      const days = [x.again, x.hard, x.good, x.easy][quality] || 1;
      card.ease = Math.max(1.3, Math.min(3.0, Number(card.ease || 2.5) + [-.20,-.15,0,.15][quality]));
      card.interval = days;
      card.stability = quality === 0 ? Math.max(.5, Number(card.stability||1)*.45) : days;
      card.difficulty = Math.max(1, Math.min(10, Number(card.difficulty||5) + [1,.4,-.15,-.4][quality]));
      card.lapses = (card.lapses||0) + (quality===0 ? 1 : 0);
      card.step = Math.min(7, Math.max(1, INTERVALS.findIndex(n=>n>=days)+1 || 7));
      card.due = addDays(todayStr(), days);
      if (quality===0 && card.lapses >= Number(state.settings.leechThreshold||8)) card.leech = true;
    } else {
      const old=card.step||0;
      const step=quality===0?1:quality===1?Math.max(1,old):Math.min(7,old+1);
      card.step=step; card.due=addDays(todayStr(),INTERVALS[step-1]);
    }
    card.reps=(card.reps||0)+1; card.lastReview=todayStr(); card.updated=new Date().toISOString();
    card.history=(card.history||[]).concat([{d:todayStr(),q:quality,step:card.step,iv:card.interval||0,r:Math.round(retrievability(card)*100)}]).slice(-200);
    if (quality>=2) ses.correct++; else ses.again++;
    if (quality===0 && ses.ids.filter(id=>id===card.id).length<2) ses.ids.push(card.id);
    ses.total=Math.max(ses.total,ses.ids.length);
  }
  ses.i++; ui.revealed=false; ui.peekId=null; saveState(); render();
}

function speakCard(id) {
  const c = state.cards.find(x => x.id === id);
  if (c) playCardAudio(c);
}

function quickCat(parentName, childName) {
  const parent = state.cats.find(c => c.name === parentName && !c.parentId) || state.cats.find(c => c.name === parentName);
  const icon = (childName.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})\s*/u) || ['', '📁'])[1];
  const name = childName.replace(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})\s*/u, '');
  if (state.cats.some(c => c.name === name && c.parentId === (parent ? parent.id : null))) { toast('มีหมวดนี้อยู่แล้ว'); return; }
  state.cats.push({ id: uid('cat'), name, parentId: parent ? parent.id : null, hidden: false, icon, lang: parent ? parent.lang : 'th-TH' });
  saveState(); render(); toast('เพิ่มหมวดแล้ว: ' + name);
}
function langName(v) { const l = LANGS.find(x => x.v === v); return l ? l.n : (v || 'ไทย'); }
function toggleCat(id) {
  const c = catById(id);
  if (!c) return;
  c.hidden = !c.hidden;
  saveState(); render();
  toast(c.hidden ? 'ซ่อนหมวด “' + c.name + '” แล้ว' : 'แสดงหมวด “' + c.name + '” แล้ว');
}

function onSentQuery(v) {
  ui.sentQuery = v;
  ui.sentLimit = 60;
  clearTimeout(window.__sentT);
  window.__sentT = setTimeout(() => { if (ui.view === 'sent') renderView(); }, 220);
}
function moreSent() { ui.sentLimit = (ui.sentLimit || 60) + 60; renderView(); }
function speakSent(i, which) {
  const p = sentView[i];
  if (!p) return;
  browserSpeak(which ? p[1] : p[0], which ? 'th-TH' : 'en-US');
}
function cardFromSent(i) {
  const p = sentView[i];
  if (!p) return;
  const isThai = /[\u0E00-\u0E7F]/.test(p[0]);
  openCardModal(null, null, isThai
    ? { word: p[1], mean: p[0], lang: 'th-TH', src: 'ประโยคใช้บ่อย' }
    : { word: p[0], mean: p[1], lang: 'en-US', src: 'ประโยคใช้บ่อย' });
}

async function generateAllAudio() {
  const s = state.settings;
  if (s.provider === 'browser') { toast('โหมดเบราว์เซอร์จะออกเสียงสด ๆ ไม่บันทึกไฟล์ — เปลี่ยนเป็น API ก่อน'); return; }
  const todo = state.cards.filter(c => !c.audio);
  if (!todo.length) { toast('ทุกบัตรมีไฟล์เสียงแล้ว'); return; }
  let ok = 0;
  for (const c of todo.slice(0, 30)) {
    try { const pid = profileOf(c).id; c.audio = await aiTTS(c.word, c.lang, pid); c.audioVoice = pid; ok++; } catch (e) { toast('ผิดพลาด: ' + e.message); break; }
  }
  saveState(); render();
  toast('สร้างเสียงสำเร็จ ' + ok + ' ไฟล์');
}

  const toks = thTokens(text, 'structure');
  let out = '', syl = '', leadBuf = '', started = false;
  const flush = () => {
    if (syl) {
      if (!/[aeiou]/.test(syl)) {                    // ไม่มีสระเขียน → เติมเสียงออ (นก → nok)
        const m = syl.match(/^(.*[^aeiou])([^aeiou]+)$/);
        if (m && m[1]) syl = m[1] + 'o' + m[2];
      }
      out += (out && !out.endsWith(' ') ? '-' : '') + syl;
      syl = '';
    }
    leadBuf = '';
  };
  for (let i = 0; i < toks.length; i++) {
    const ch = toks[i][0], kind = toks[i][1];
    if (kind === 'lead') { leadBuf += (ch === 'ห' || ch === 'อ') ? '' : (TH_RO_C[ch] || ''); continue; }
    if (kind === 'cluster') { syl += TH_RO_C[ch] || ''; started = true; continue; }
    if (kind === 'initial') {
      if (started) flush();
      syl = leadBuf + (TH_RO_C[ch] || '');
      leadBuf = '';
      started = true;
      continue;
    }
    if (TH_RO_LEAD[ch]) {                            // สระนำหน้า เติมหลังพยัญชนะตัวถัดไป
      const nx = toks[i + 1];
      if (nx && (nx[1] === 'initial' || nx[1] === 'cluster' || nx[1] === 'lead')) {
        if (started) flush();
        syl = leadBuf + (TH_RO_C[nx[0]] || '') + TH_RO_LEAD[ch];
        leadBuf = ''; started = true; i++;
        continue;
      }
      syl += TH_RO_LEAD[ch];
      continue;
    }
    if (kind === 'final') {
      if (ch === 'ว') { syl += /a$/.test(syl) ? 'o' : 'w'; continue; }   // ขาว → khao, แมว → maew
      if (ch === 'ย') { if (!/ai$/.test(syl)) syl += 'i'; continue; }     // ไทย → thai
      syl += TH_RO_FINAL[ch] || '';
      continue;
    }
    if (kind === 'vowel') {
      if (ch === 'อ' && /[aeiou]$/.test(syl)) continue;   // หนังสือ → nang-sue (ไม่ใช่ sueo)
      if (ch === 'ว') { syl = syl.replace(/a$/, '') + 'ua'; continue; }   // ัว → ua (ตัว → tua)
      syl += TH_RO_V[ch] || '';
      continue;
    }
    if (kind === 'tone' || kind === 'silent') continue;
    if (ch === ' ') { flush(); out += ' '; started = false; continue; }
    if (/[a-zA-Z0-9]/.test(ch)) { syl += ch; continue; }
  }
  flush();
  return out.replace(/--+/g, '-').replace(/^[-\s]+|[-\s]+$/g, '');
}

/* ---- ออนไลน์: แปล + ค้นรูป ---- */
function withTimeout(promise, ms) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout')), ms || 7000);
    promise.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
  });
}
async function translateOnline(text, from, to) {
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;
  const r = await withTimeout(fetch(url), 7000);
  if (!r.ok) throw new Error('translate ' + r.status);
  const j = await r.json();
  const t = j && j.responseData && j.responseData.translatedText;
  if (!t || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error('quota');
  return String(t).replace(/\s+/g, ' ').trim();
}
async function searchImages(query, n) {
  const url = 'https://api.openverse.org/v1/images/?q=' + encodeURIComponent(query) +
    '&page_size=' + (n || 10) + '&license_type=all&mature=false&aspect_ratio=square';
  const r = await withTimeout(fetch(url), 8000);
  if (!r.ok) throw new Error('image ' + r.status);
  const j = await r.json();
  return (j.results || []).map(x => x.thumbnail || x.url).filter(Boolean).slice(0, 8);
}

/* ---- ตัวควบคุมการเติมข้อมูลอัตโนมัติ ---- */
let autoTimer = null, lastAuto = { word: '', lang: '' }, afReq = 0;
let imgCache = [], imgIdx = 0, imgQuery = '';
let autoFilled = { 'f-rt': false, 'f-re': false, 'f-mean': false, img: false, audio: false };
function markManual(id) { autoFilled[id] = false; }
function afStatus(msg, kind) {
  const el = document.getElementById('autoFillStatus');
  if (!el) return;
  el.className = 'hint af-' + (kind || 'info');
  el.innerHTML = msg;
}
function onWordInput() {
  updateColorPreview();
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => autoFillCard(), 800);
}
function setImgPreview(url) {
  const prev = document.getElementById('imgPrev');
  if (prev) prev.innerHTML = url ? `<img src="${url}">` : '🖼️';
}
async function autoFillCard(opts) {
  opts = opts || {};
  const wEl = document.getElementById('f-word');
  if (!wEl) return;
  const raw = wEl.value.trim();
  const langEl = document.getElementById('f-lang');
  const lang = langEl ? langEl.value : 'en-US';
  if (!raw) { afStatus('พิมพ์คำศัพท์ก่อน แล้วกด ✨ เติมอัตโนมัติ', 'warn'); return; }
  if (!opts.force && lastAuto.word === raw && lastAuto.lang === lang) return;
  lastAuto = { word: raw, lang };
  const myReq = ++afReq;

  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const fill = (id, v) => {
    const el = document.getElementById(id);
    if (!el) return false;
    const own = !el.value.trim() || autoFilled[id];   // ว่าง หรือระบบเคยเติมเอง
    if (!own) return false;
    if (!v) { if (autoFilled[id]) { el.value = ''; autoFilled[id] = false; } return false; }
    if (el.value !== v) { el.value = v; autoFilled[id] = true; return true; }
    autoFilled[id] = true;
    return false;
  };

  afStatus('⏳ กำลังค้นหาข้อมูลให้…', 'info');
  const key = raw.toLowerCase().replace(/[^a-z0-9 '\u0E00-\u0E7F]/g, '').replace(/\s+/g, ' ').trim();
  const fromLang = lang.slice(0, 2);
  let readThai = '', readEn = '', mean = '', srcs = [], ipaLocal = '';
  let dictInfo = null;

  /* ---------- 1) คำอ่าน + ความหมายตั้งต้น ---------- */
  if (fromLang === 'en') {
    readEn = raw;                                   // ค่าชั่วคราว (จะถูกแทนด้วย IPA ถ้าหาได้)
    const d = AUTO_DICT[key], lx = LEX_EN[key];
    if (d) { mean = d[0]; readThai = d[1]; srcs.push('พจนานุกรมในเครื่อง'); }
    else {
      readThai = '≈ ' + enGuessThai(raw); srcs.push('เดาคำอ่าน');
      if (lx) { mean = lx[0]; srcs.push('คลังคำในเครื่อง'); }
    }
    if (lx && lx[1]) { readEn = lx[1]; ipaLocal = lx[1]; srcs.push('IPA ในเครื่อง'); }
    if (!d && ipaLocal) {                       // ไม่มีคำอ่านคัดสรร → ประมาณจาก IPA
      const approx = ipaToThai(ipaLocal);
      if (approx) { readThai = '≈ ' + approx; srcs[srcs.length - 1] = 'คำอ่านไทยโดยประมาณ'; srcs.push('IPA ในเครื่อง'); }
    }
  } else if (lang === 'th-TH') {
    readThai = raw;
    readEn = thRomanize(raw);
    srcs.push('ถอดอักษรโรมัน');
    const r = TH_REV[key] || TH_REV[raw];
    if (r) { mean = r.en; srcs.push('พจนานุกรมในเครื่อง'); }
  } else if (lang === 'my-MM') {
    readEn = '';
    afStatus('ℹ️ ภาษาพม่า: ระบบยังไม่มีคำอ่านอัตโนมัติ (พิมพ์เองหรืออัพโหลดเสียง)', 'info');
  }

  /* ---------- 2) ออนไลน์: IPA + เสียงเจ้าของภาษา + แปลที่ตรวจแล้ว ---------- */
  let note = '';
  if (state.settings.autoOnline) {
    const from = fromLang;
    if (from === 'en') {
      // 2.1 IPA + เสียงจากพจนานุกรม API (ตรงตามหลักสากล)
      try {
        dictInfo = await fetchEnDict(raw);
        if (dictInfo) {
          // ใช้ IPA ในเครื่อง (en-US จาก ipa-dict) เป็นหลัก · คำที่ไม่มีในคลังหรือเลือกบริติชจึงใช้ของออนไลน์
          if (dictInfo.ipa && (!ipaLocal || /^en-GB/i.test(lang))) {
            readEn = dictInfo.ipa; srcs.push('IPA (dictionaryapi.dev)');
          }
          if (!AUTO_DICT[key] && (dictInfo.ipa || ipaLocal)) {
            const approx = ipaToThai(dictInfo.ipa || ipaLocal);
            if (approx) readThai = '≈ ' + approx;
          }
          const pill = document.getElementById('audioPill');
          if (dictInfo.audio && (!tmpAudio || autoFilled.audio)) {
            tmpAudio = dictInfo.audio;
            autoFilled.audio = true;
            if (pill) { pill.textContent = 'มีเสียงเจ้าของภาษาแล้ว'; pill.classList.add('ok'); }
            srcs.push('เสียงเจ้าของภาษา');
          } else if (!dictInfo.audio && autoFilled.audio) {
            tmpAudio = ''; autoFilled.audio = false;
            if (pill) { pill.textContent = 'ยังไม่มีไฟล์เสียง'; pill.classList.remove('ok'); }
          }
        }
      } catch (e) { note = '⚠️ พจนานุกรม IPA ใช้งานไม่ได้ชั่วคราว'; }
    }
    // 2.2 ความหมายภาษาไทย (ตรวจว่าผลลัพธ์เป็นไทยจริง และไม่ใช่คำเดิม)
    if (!mean) {                       // มีความหมายจากพจนานุกรมแล้ว → ไม่ต้องแปลทับ
      try {
        const t = cleanTrans(await translateOnline(raw, from, from === 'th' ? 'en' : 'th'));
        if (from === 'th') {
          const tt = t.replace(/^(a|an|the)\s+/i, '');
          if (tt && hasLatin(tt) && !hasThai(tt)) { mean = tt; srcs.push('แปลออนไลน์'); }
          else if (t) note = '⚠️ คำแปลอังกฤษไม่ชัดเจน';
        } else {
          if (t && hasThai(t) && !sameWord(t, raw)) {
            const pos = dictInfo && dictInfo.pos ? ' (' + (POS_TH[dictInfo.pos] || dictInfo.pos) + ')' : '';
            mean = t + pos;
            srcs.push('แปลออนไลน์');
          } else if (t && !hasThai(t)) {
            note = '⚠️ แปลไทยไม่สำเร็จ (ผลลัพธ์ไม่ใช่ภาษาไทย) — ใช้ความหมายจากพจนานุกรมแทน';
          }
        }
      } catch (e) { note = '⚠️ แปลออนไลน์ใช้งานไม่ได้'; }
    }
  }

  if (myReq !== afReq) return;   // มีคำขอใหม่กว่าแล้ว → ทิ้งผลลัพธ์นี้

  /* ---------- 3) เขียนลงช่อง ---------- */
  const filled = [];
  if (fill('f-rt', readThai)) filled.push('คำอ่านไทย');
  if (fill('f-re', readEn)) {
    const ipa = !!(ipaLocal || (dictInfo && dictInfo.ipa));
    filled.push(fromLang === 'en' ? (ipa ? 'คำอ่าน IPA' : 'คำอ่านอังกฤษ (คำเดิม)') : 'คำอ่านโรมัน');
  }
  if (fill('f-mean', mean)) filled.push('ความหมาย');

  /* ---------- 4) รูปภาพ ---------- */
  if (state.settings.autoOnline && (!tmpImg || autoFilled.img)) {
    try {
      const q = fromLang === 'th' ? (mean || val('f-mean') || readEn || raw) : raw;
      if (q) {
        imgQuery = q;
        imgCache = await searchImages(q);
        imgIdx = 0;
        if (imgCache.length) {
          tmpImg = imgCache[imgIdx];
          autoFilled.img = true;
          setImgPreview(tmpImg);
          const u0 = document.getElementById('f-imgurl'); if (u0) u0.value = /^https?:/i.test(tmpImg) ? tmpImg : '';
          filled.push('รูปภาพ');
          document.querySelectorAll('.seedpick button').forEach(b => b.classList.remove('on'));
          const sh = document.getElementById('imgShuffle');
          if (sh) sh.style.display = imgCache.length > 1 ? 'inline-flex' : 'none';
        }
      }
    } catch (e) { note = '⚠️ ค้นรูปออนไลน์ใช้งานไม่ได้'; }
  }

  if (myReq !== afReq) return;
  const uniq = srcs.filter((v, i, a) => a.indexOf(v) === i).join(' · ');
  if (filled.length) {
    afStatus('✅ เติมให้แล้ว: ' + filled.join(' · ') + (uniq ? ' <span class="muted">(' + uniq + ')</span>' : '') + (note ? '<br>' + note : ''), 'ok');
    updateColorPreview();
  } else {
    afStatus('ℹ️ ช่องข้อมูลครบแล้ว — ลบช่องที่ต้องการให้เติมใหม่ก่อน' + (note ? '<br>' + note : ''), 'info');
  }
}

function shuffleImage() {
  if (imgCache.length < 2) { toast('ไม่มีรูปอื่นให้เปลี่ยน'); return; }
  imgIdx = (imgIdx + 1) % imgCache.length;
  tmpImg = imgCache[imgIdx];
  setImgPreview(tmpImg);
  const u0 = document.getElementById('f-imgurl'); if (u0) u0.value = /^https?:/i.test(tmpImg) ? tmpImg : '';
  toast('เปลี่ยนรูปแล้ว (' + (imgIdx + 1) + '/' + imgCache.length + ')');
}

/* ---------- ตัวแยกข้อความหลายรูปแบบ ---------- */
const RE_TH_CH = /[\u0E00-\u0E7F]/;
const RE_IPA_CH = /[\/\[\]ˈˌæðθʃŋɑɔəɜʊʌɹɾɲɡʤʧːˑ]/;
function isThaiText(x) { return RE_TH_CH.test(x); }
function isIPAText(x) { return /^[\/\[][^\/\]]*[\/\]]$/.test(x.trim()) || RE_IPA_CH.test(x); }

function parseBulkText(text) {
  const src = String(text || '');
  // วางรายชื่อคำล้วน ๆ (ไม่มีไทย/สัทอักษร/ตัวคั่น) → บรรทัดละ 1 คำ
  if (src.indexOf('|') < 0 && src.indexOf('\t') < 0 && !RE_TH_CH.test(src) && !isIPAText(src)) {
    return src.split(/\r?\n/).map(x => x.trim()).filter(Boolean)
      .map(w => ({ word: w, readThai: '', readEn: '', mean: '' }));
  }
  const rows = [];
  let cur = null, mode = null;
  const blank = () => ({ word: '', readThai: '', readEn: '', mean: '' });
  const flush = () => { if (cur && cur.word) rows.push(cur); cur = null; mode = null; };
  const startRec = (line) => {
    cur = blank();
    if (isThaiText(line)) { mode = 'th'; cur.word = line; cur.readThai = line; }
    else { mode = 'en'; cur.word = line; }
  };

  String(text || '').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) { flush(); return; }

    /* 1) คั่นด้วย | หรือ Tab (วางจาก Excel/Sheets) */
    if (line.indexOf('|') >= 0 || line.indexOf('\t') >= 0) {
      flush();
      const parts = line.split(line.indexOf('|') >= 0 ? '|' : '\t').map(x => x.trim());
      const r = blank();
      r.word = parts[0] || '';
      const rest = parts.slice(1);
      if (rest.length === 1) {                     // 2 ช่อง: เดาชนิดจากข้อความ
        if (isThaiText(rest[0]) && !isThaiText(r.word)) r.mean = rest[0];
        else if (isThaiText(rest[0])) r.mean = rest[0];
        else if (isIPAText(rest[0])) r.readEn = rest[0];
        else r.readEn = rest[0];
      } else {
        r.readThai = rest[0] || '';
        r.readEn = rest[1] || '';
        r.mean = rest[2] || '';
      }
      if (r.word) rows.push(r);
      return;
    }

    /* 2) บล็อกหลายบรรทัด */
    if (!cur) startRec(line);
    else if (isIPAText(line) && !isThaiText(line)) {
      if (!cur.readEn) cur.readEn = line;
      else { flush(); startRec(line); }
    } else if (isThaiText(line)) {
      if (mode === 'th') {
        if (!cur.mean) { if (cur.readEn) cur.mean = line; else cur.mean = line; }
        else { flush(); startRec(line); }
      } else {
        if (!cur.readThai) cur.readThai = line;
        else if (!cur.mean) cur.mean = line;
        else { flush(); startRec(line); }
      }
    } else {                                        // บรรทัดภาษาอังกฤษล้วน
      const hasInfo = cur.readThai || cur.readEn || cur.mean;
      if (mode === 'th') {
        if (!cur.readEn) cur.readEn = line;
        else if (!cur.mean) cur.mean = line;
        else { flush(); startRec(line); }
      } else if (!hasInfo) {
        cur.readEn = line;
      } else {
        flush(); startRec(line);
      }
    }
  });
  flush();
  return rows.filter(r => r.word);
}

/* เติมช่องที่ว่างจากคลังคำในเครื่อง (ไม่ต้องต่อเน็ต) */
function bulkAutoComplete(list) {
  let n = 0;
  list.forEach(c => {
    const key = String(c.word || '').toLowerCase().replace(/[^a-z0-9 '\u0E00-\u0E7F]/g, '').replace(/\s+/g, ' ').trim();
    if (!key) return;
    if (!c.mean) {
      if (c.lang === 'en-US' || /^[a-z]/i.test(c.word)) {
        const lx = LEX_EN[key];
        if (lx && lx[0]) { c.mean = lx[0]; n++; }
      }
      if (!c.mean) {
        const r = TH_REV[key];
        if (r && r.en) { c.mean = r.en; n++; }
      }
    }
    if (!c.readEn && LEX_EN[key] && LEX_EN[key][1]) { c.readEn = LEX_EN[key][1]; n++; }
    if (!c.readThai) {
      const d = AUTO_DICT[key];
      if (d && d[1]) { c.readThai = d[1]; n++; }   // ใช้คำอ่านคัดสรรเท่านั้น
    }
  });
  return n;
}

function fileToDataURL(file, maxSize) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      if (!imageNeedsResize(file.type)) return res(fr.result);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  }).catch(rej => { throw rej; });
}
function imageNeedsResize(t) { return /^image\//.test(t) && !/gif|svg/.test(t); }

function setImgFromUrl() {
  const el = document.getElementById('f-imgurl');
  if (!el) return;
  let v = el.value.trim();
  if (!v) { toast('วางลิงก์รูปก่อน'); return; }
  if (!/^(https?:\/\/|data:image\/)/i.test(v)) {
    toast('ลิงก์ต้องเริ่มด้วย http:// หรือ https:// (หรือ data:image/…)');
    return;
  }
  // Google Drive → ลิงก์รูปตรง
  const gd = v.match(/drive\.google\.com\/file\/d\/([\w-]{10,})/) || v.match(/drive\.google\.com\/(?:open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  if (gd) v = 'https://drive.google.com/uc?export=view&id=' + gd[1];
  // Dropbox → ลิงก์ตรง
  if (/dropbox\.com/i.test(v)) v = v.replace(/[?&]dl=\d/, '').replace(/\?dl=0/, '?raw=1').replace(/\?dl=1/, '?raw=1');

  tmpImg = v;
  autoFilled.img = false;
  document.querySelectorAll('.seedpick button').forEach(b => b.classList.remove('on'));
  const sh = document.getElementById('imgShuffle');
  if (sh) sh.style.display = 'none';
  const prev = document.getElementById('imgPrev');
  if (prev) prev.innerHTML = `<img src="${v}" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='🖼️'">`;
  el.value = v;
  if (/^https?:/i.test(v)) {
    const probe = new Image();
    probe.onload = () => toast('ใช้รูปจากลิงก์แล้ว ✅');
    probe.onerror = () => toast('⚠️ โหลดรูปไม่ได้ (เว็บอาจบล็อก hotlink) — ยังบันทึกไว้ได้');
    probe.src = v;
  } else toast('ใช้รูปจากลิงก์แล้ว');
}

async function ttsNow() {
  const word = (document.getElementById('f-word') || {}).value || '';
  const lang = (document.getElementById('f-lang') || {}).value || 'en-US';
  if (!word.trim()) { toast('ใส่คำศัพท์ก่อน'); return; }
